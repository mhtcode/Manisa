services:
  postgres:
    image: postgres:17-alpine
    container_name: manisa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: manisa
      POSTGRES_USER: manisa
      POSTGRES_PASSWORD: manisa
    ports: ["5432:5432"]
    volumes: ["manisa_postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manisa -d manisa"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  manisa_postgres_data:
