name: manisa

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-manisa}
      POSTGRES_USER: ${POSTGRES_USER:-manisa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manisa}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - manisa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    stop_grace_period: 30s

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-manisa}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-replace-with-a-long-object-storage-secret}
    volumes:
      - manisa_minio_data:/data
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}" &&
        mc mb --ignore-existing local/$${S3_PRIVATE_BUCKET} &&
        mc mb --ignore-existing local/$${S3_PUBLIC_BUCKET} &&
        mc anonymous set download local/$${S3_PUBLIC_BUCKET}
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-manisa}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-replace-with-a-long-object-storage-secret}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:-manisa-private}
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:-manisa-public}

  web-init:
    build:
      context: ./apps/web
      target: database
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-manisa}:${POSTGRES_PASSWORD:-manisa}@postgres:5432/${POSTGRES_DB:-manisa}?schema=public
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@manisa.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-change-me-now-1234}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      target: runner
      args:
        NEXT_PUBLIC_BUSINESS_ADDRESS: ${NEXT_PUBLIC_BUSINESS_ADDRESS:-Toronto, Ontario}
        NEXT_PUBLIC_INSTAGRAM_URL: ${NEXT_PUBLIC_INSTAGRAM_URL:-}
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-manisa}:${POSTGRES_PASSWORD:-manisa}@postgres:5432/${POSTGRES_DB:-manisa}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-change-this-local-auth-secret-before-production}
      PLATFORM_SETUP_TOKEN: ${PLATFORM_SETUP_TOKEN:-replace-with-a-long-one-time-setup-token}
      DEFAULT_STORAGE_QUOTA_BYTES: ${DEFAULT_STORAGE_QUOTA_BYTES:-10737418240}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_AUTH_REDIRECT_URI: ${GOOGLE_AUTH_REDIRECT_URI:-}
      GOOGLE_AUTH_ALLOW_SIGNUP: ${GOOGLE_AUTH_ALLOW_SIGNUP:-false}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-primary}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      INSTAGRAM_REDIRECT_URI: ${INSTAGRAM_REDIRECT_URI:-}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      TRASH_CLEANUP_SECRET: ${TRASH_CLEANUP_SECRET:-change-this-local-trash-cleanup-secret}
      NEXT_PUBLIC_BUSINESS_ADDRESS: ${NEXT_PUBLIC_BUSINESS_ADDRESS:-Toronto, Ontario}
      NEXT_PUBLIC_INSTAGRAM_URL: ${NEXT_PUBLIC_INSTAGRAM_URL:-}
      UPLOADS_DIR: /app/uploads
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://127.0.0.1:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-manisa}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-replace-with-a-long-object-storage-secret}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:-manisa-private}
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:-manisa-public}
    volumes:
      - manisa_uploads:/app/uploads
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      web-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  media-worker:
    build:
      context: ./apps/web
      target: media-worker
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-manisa}:${POSTGRES_PASSWORD:-manisa}@postgres:5432/${POSTGRES_DB:-manisa}?schema=public
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-manisa}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-replace-with-a-long-object-storage-secret}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:-manisa-private}
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:-manisa-public}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      web-init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true

  legacy-media-migrate:
    profiles: ["migration"]
    build:
      context: ./apps/web
      target: media-worker
    restart: "no"
    command: ["node", "scripts/migrate-legacy-media.mjs"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-manisa}:${POSTGRES_PASSWORD:-manisa}@postgres:5432/${POSTGRES_DB:-manisa}?schema=public
      UPLOADS_DIR: /app/uploads
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-manisa}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-replace-with-a-long-object-storage-secret}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:-manisa-private}
    volumes:
      - manisa_uploads:/app/uploads:ro
    depends_on:
      minio-init:
        condition: service_completed_successfully
      web-init:
        condition: service_completed_successfully

  trash-worker:
    build:
      context: ./apps/web
      target: runner
      args:
        NEXT_PUBLIC_BUSINESS_ADDRESS: ${NEXT_PUBLIC_BUSINESS_ADDRESS:-Toronto, Ontario}
        NEXT_PUBLIC_INSTAGRAM_URL: ${NEXT_PUBLIC_INSTAGRAM_URL:-}
    restart: unless-stopped
    init: true
    environment:
      TRASH_CLEANUP_SECRET: ${TRASH_CLEANUP_SECRET:-change-this-local-trash-cleanup-secret}
    command: ["sh", "-c", "while true; do wget -qO- --post-data='' --header=\"Authorization: Bearer $$TRASH_CLEANUP_SECRET\" http://web:3000/api/internal/trash/purge || true; sleep 3600; done"]
    depends_on:
      web:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: true

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-manisa}:${POSTGRES_PASSWORD:-manisa}@postgres:5432/${POSTGRES_DB:-manisa}?schema=public
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  manisa_postgres_data:
  manisa_uploads:
  manisa_minio_data:
