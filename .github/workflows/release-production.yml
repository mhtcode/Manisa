name: Production Release

on:
  workflow_dispatch:

permissions:
  contents: read

# Never allow two production release workflows to modify
# the server at the same time.
concurrency:
  group: manisa-production-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build and Push Production Images

    # workflow_run fires even when CI fails.
    # Only continue after a successful push-based CI run.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    runs-on: ubuntu-latest

    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}

    steps:
      - name: Validate release configuration
        env:
          BUSINESS_ADDRESS: ${{ vars.NEXT_PUBLIC_BUSINESS_ADDRESS }}
          INSTAGRAM_URL: ${{ vars.NEXT_PUBLIC_INSTAGRAM_URL }}
        run: |
          set -euo pipefail

          test -n "$RELEASE_SHA" || {
            echo "RELEASE_SHA is empty"
            exit 1
          }

          test -n "$DOCKERHUB_USERNAME" || {
            echo "DOCKERHUB_USERNAME repository variable is missing"
            exit 1
          }

          test -n "$BUSINESS_ADDRESS" || {
            echo "NEXT_PUBLIC_BUSINESS_ADDRESS repository variable is missing"
            exit 1
          }

          test -n "$INSTAGRAM_URL" || {
            echo "NEXT_PUBLIC_INSTAGRAM_URL repository variable is missing"
            exit 1
          }

          echo "Preparing release:"
          echo "  SHA: $RELEASE_SHA"
          echo "  Docker Hub user: $DOCKERHUB_USERNAME"

      - name: Checkout tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -------------------------------------------------------
      # Web
      # -------------------------------------------------------

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: ./apps/web
          target: runner
          push: true

          build-args: |
            NEXT_PUBLIC_BUSINESS_ADDRESS=${{ vars.NEXT_PUBLIC_BUSINESS_ADDRESS }}
            NEXT_PUBLIC_INSTAGRAM_URL=${{ vars.NEXT_PUBLIC_INSTAGRAM_URL }}

          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/manisa-web:${{ env.RELEASE_SHA }}
            ${{ vars.DOCKERHUB_USERNAME }}/manisa-web:latest

          cache-from: type=gha,scope=manisa-web
          cache-to: type=gha,mode=max,scope=manisa-web

          provenance: true
          sbom: true

      # -------------------------------------------------------
      # Migrations
      # -------------------------------------------------------

      - name: Build and push migrations image
        uses: docker/build-push-action@v7
        with:
          context: ./apps/web
          target: migrations
          push: true

          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/manisa-migrations:${{ env.RELEASE_SHA }}
            ${{ vars.DOCKERHUB_USERNAME }}/manisa-migrations:latest

          cache-from: type=gha,scope=manisa-migrations
          cache-to: type=gha,mode=max,scope=manisa-migrations

          provenance: true
          sbom: true

      # -------------------------------------------------------
      # Worker
      # -------------------------------------------------------

      - name: Build and push worker image
        uses: docker/build-push-action@v7
        with:
          context: ./apps/web
          target: worker
          push: true

          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/manisa-worker:${{ env.RELEASE_SHA }}
            ${{ vars.DOCKERHUB_USERNAME }}/manisa-worker:latest

          cache-from: type=gha,scope=manisa-worker
          cache-to: type=gha,mode=max,scope=manisa-worker

          provenance: true
          sbom: true

      - name: Release summary
        run: |
          echo "### Docker images published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${DOCKERHUB_USERNAME}/manisa-web:${RELEASE_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${DOCKERHUB_USERNAME}/manisa-worker:${RELEASE_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${DOCKERHUB_USERNAME}/manisa-migrations:${RELEASE_SHA}\`" >> "$GITHUB_STEP_SUMMARY"


  deploy:
    name: Deploy to Hetzner

    needs:
      - publish

    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://manisa.masihtan.com

    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" \
            > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" \
            > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Verify production server
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            '
              set -e

              echo "Connected to production:"
              hostname
              whoami

              docker --version
              docker compose version

              test -x /opt/manisa/deploy.sh
              test -r /opt/manisa/.env
              test -r /opt/manisa/compose.production.yaml

              echo "Production deployment files are ready."
            '

      - name: Deploy release
        run: |
          set -euo pipefail

          echo "Deploying release: $RELEASE_SHA"

          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "/opt/manisa/deploy.sh '$RELEASE_SHA'"

      - name: Verify deployed release
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "/opt/manisa/deploy.sh status"

      - name: Deployment summary
        run: |
          echo "### Production deployment succeeded" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Release:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$RELEASE_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: https://manisa.masihtan.com" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove SSH private key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key