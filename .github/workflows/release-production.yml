name: Production Release

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: manisa-production-release
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ github.sha }}
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}

jobs:

  # ============================================================
  # PRE-FLIGHT
  # ============================================================

  preflight:
    name: Validate Production Release
    runs-on: ubuntu-latest

    steps:
      - name: Verify selected branch
        run: |
          set -euo pipefail

          echo "Selected ref: $GITHUB_REF"
          echo "Release SHA: $RELEASE_SHA"

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "ERROR: Production releases are only allowed from main."
            exit 1
          fi

      - name: Validate repository configuration
        env:
          BUSINESS_ADDRESS: ${{ vars.NEXT_PUBLIC_BUSINESS_ADDRESS }}
          INSTAGRAM_URL: ${{ vars.NEXT_PUBLIC_INSTAGRAM_URL }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          test -n "$DOCKERHUB_USERNAME" || {
            echo "ERROR: DOCKERHUB_USERNAME variable is missing."
            exit 1
          }

          test -n "$BUSINESS_ADDRESS" || {
            echo "ERROR: NEXT_PUBLIC_BUSINESS_ADDRESS variable is missing."
            exit 1
          }

          test -n "$INSTAGRAM_URL" || {
            echo "ERROR: NEXT_PUBLIC_INSTAGRAM_URL variable is missing."
            exit 1
          }

          test -n "$DOCKERHUB_TOKEN" || {
            echo "ERROR: DOCKERHUB_TOKEN secret is missing."
            exit 1
          }

          echo "Repository configuration looks valid."

      - name: Verify CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "Checking CI for:"
          echo "  $RELEASE_SHA"

          CI_CONCLUSION="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${RELEASE_SHA}&branch=main&status=completed&per_page=20" \
              --jq '.workflow_runs[0].conclusion // ""'
          )"

          if [ -z "$CI_CONCLUSION" ]; then
            echo "ERROR: No completed CI run was found for:"
            echo "  $RELEASE_SHA"
            echo
            echo "Wait for CI to finish successfully before deploying."
            exit 1
          fi

          echo "CI conclusion: $CI_CONCLUSION"

          if [ "$CI_CONCLUSION" != "success" ]; then
            echo "ERROR: CI did not pass for this commit."
            exit 1
          fi

          echo "CI passed."


  # ============================================================
  # BUILD + PUBLISH
  # ============================================================

  publish:
    name: Build and Push Production Images
    needs:
      - preflight

    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # --------------------------------------------------------
      # WEB IMAGE
      # --------------------------------------------------------

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: ./apps/web
          target: runner
          platforms: linux/amd64
          push: true

          build-args: |
            NEXT_PUBLIC_BUSINESS_ADDRESS=${{ vars.NEXT_PUBLIC_BUSINESS_ADDRESS }}
            NEXT_PUBLIC_INSTAGRAM_URL=${{ vars.NEXT_PUBLIC_INSTAGRAM_URL }}

          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/manisa-web:${{ env.RELEASE_SHA }}
            ${{ vars.DOCKERHUB_USERNAME }}/manisa-web:latest

          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}

          cache-from: type=gha,scope=manisa-web
          cache-to: type=gha,mode=max,scope=manisa-web

          provenance: true
          sbom: true


      # --------------------------------------------------------
      # MIGRATION IMAGE
      # --------------------------------------------------------

      - name: Build and push migrations image
        uses: docker/build-push-action@v7
        with:
          context: ./apps/web
          target: migrations
          platforms: linux/amd64
          push: true

          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/manisa-migrations:${{ env.RELEASE_SHA }}
            ${{ vars.DOCKERHUB_USERNAME }}/manisa-migrations:latest

          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}

          cache-from: type=gha,scope=manisa-migrations
          cache-to: type=gha,mode=max,scope=manisa-migrations

          provenance: true
          sbom: true


      # --------------------------------------------------------
      # WORKER IMAGE
      # --------------------------------------------------------

      - name: Build and push worker image
        uses: docker/build-push-action@v7
        with:
          context: ./apps/web
          target: worker
          platforms: linux/amd64
          push: true

          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/manisa-worker:${{ env.RELEASE_SHA }}
            ${{ vars.DOCKERHUB_USERNAME }}/manisa-worker:latest

          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}

          cache-from: type=gha,scope=manisa-worker
          cache-to: type=gha,mode=max,scope=manisa-worker

          provenance: true
          sbom: true


      # --------------------------------------------------------
      # BUILD SUMMARY
      # --------------------------------------------------------

      - name: Docker image summary
        run: |
          {
            echo "## Docker images published"
            echo
            echo "\`${DOCKERHUB_USERNAME}/manisa-web:${RELEASE_SHA}\`"
            echo
            echo "\`${DOCKERHUB_USERNAME}/manisa-worker:${RELEASE_SHA}\`"
            echo
            echo "\`${DOCKERHUB_USERNAME}/manisa-migrations:${RELEASE_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"


  # ============================================================
  # PRODUCTION DEPLOYMENT
  # ============================================================

  deploy:
    name: Deploy to Hetzner
    needs:
      - publish

    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://manisa.masihtan.com

    steps:

      # --------------------------------------------------------
      # SSH CONFIGURATION
      # --------------------------------------------------------

      - name: Configure SSH
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" \
            > "$HOME/.ssh/deploy_key"

          chmod 600 "$HOME/.ssh/deploy_key"

          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" \
            > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"


      # --------------------------------------------------------
      # SERVER PRE-FLIGHT
      # --------------------------------------------------------

      - name: Verify production server
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            '
              set -euo pipefail

              echo "========================================"
              echo "Production server"
              echo "========================================"

              echo "Hostname:"
              hostname

              echo
              echo "User:"
              whoami

              echo
              echo "Docker:"
              docker --version

              echo
              echo "Docker Compose:"
              docker compose version

              echo
              echo "Checking deployment directory..."

              test -d /opt/manisa || {
                echo "ERROR: /opt/manisa does not exist."
                exit 1
              }

              test -x /opt/manisa/deploy.sh || {
                echo "ERROR: deploy.sh is missing or not executable."
                exit 1
              }

              test -r /opt/manisa/.env || {
                echo "ERROR: .env is missing or not readable."
                exit 1
              }

              test -r /opt/manisa/compose.production.yaml || {
                echo "ERROR: compose.production.yaml is missing or not readable."
                exit 1
              }

              docker network inspect proxy >/dev/null 2>&1 || {
                echo "ERROR: Docker network proxy does not exist."
                exit 1
              }

              echo
              echo "Production server pre-flight passed."
            '


      # --------------------------------------------------------
      # DEPLOY EXACT SHA
      # --------------------------------------------------------

      - name: Deploy release
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Deploying Manisa"
          echo "========================================"
          echo
          echo "Release:"
          echo "  $RELEASE_SHA"
          echo

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "/opt/manisa/deploy.sh '$RELEASE_SHA'"


      # --------------------------------------------------------
      # SERVER-SIDE STATUS
      # --------------------------------------------------------

      - name: Show production status
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "/opt/manisa/deploy.sh status"



      # --------------------------------------------------------
      # SUCCESS SUMMARY
      # --------------------------------------------------------

      - name: Production deployment summary
        run: |
          {
            echo "## Production deployment succeeded"
            echo
            echo "**Release:**"
            echo
            echo "\`$RELEASE_SHA\`"
            echo
            echo "**Production URL:**"
            echo
            echo "https://manisa.masihtan.com"
          } >> "$GITHUB_STEP_SUMMARY"


      # --------------------------------------------------------
      # CLEAN LOCAL SSH KEY
      # --------------------------------------------------------

      - name: Remove SSH private key
        if: always()
        run: |
          rm -f "$HOME/.ssh/deploy_key"