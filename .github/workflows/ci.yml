name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: manisa_test
          POSTGRES_USER: manisa
          POSTGRES_PASSWORD: manisa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U manisa -d manisa_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://manisa:manisa@localhost:5432/manisa_test?schema=public
      AUTH_SECRET: ci-only-secret-value-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
